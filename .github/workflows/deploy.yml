name: Deploy EduProva to EC2

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Go to project"
            cd /var/www/work-updates

            echo "Pull latest code"
            git fetch --all
            git reset --hard origin/main || git reset --hard origin/master

            echo "Backend deploy"
            cd /var/www/work-updates/backend

            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            pip install gunicorn uvicorn motor pymongo

            echo "Frontend deploy"
            cd /var/www/work-updates/work-updates
            echo "VITE_API_BASE_URL=/api" > .env
            npm install
            npm run build

            echo "Restart PM2"
            pm2 restart eduprova-backend || pm2 start "/var/www/work-updates/backend/venv/bin/gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app --bind 127.0.0.1:8000" --name eduprova-backend --cwd /var/www/work-updates/backend

            pm2 restart eduprova-frontend || pm2 start "serve -s dist -l 3000" --name eduprova-frontend --cwd /var/www/work-updates/work-updates

            pm2 save

            echo "Restart Nginx"
            sudo nginx -t
            sudo systemctl restart nginx

            echo "Deployment completed"
